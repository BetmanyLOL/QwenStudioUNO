<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qwen Studio — Nexus Hub</title>
<style>
@font-face{
  font-family:"AnthropicSans Display";
  src:local("AnthropicSans Display Light"), local("AnthropicSans-Display-Light-Static");
  font-weight:300; font-display:swap;
}
:root{
  --bg:#141312; --panel:#1a1918; --panel-alt:#211f1d; --border:#2e2c29;
  --accent:#d97757; --accent-soft:#c35f3d;
  --text:#faf9f5; --text-ai:#eeece6; --text-dim:#a8a69e;
  --serif:"AnthropicSans Display","Tiempos Text",Georgia,"Times New Roman",serif;
  --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code","Consolas",monospace;
  color-scheme: dark;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--text-ai); font-family:var(--sans);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100vh;
}

a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
::selection{background:var(--accent); color:#1a1a18;}

/* ===== Ambient glow (same halo as the main site) ===== */
.ambient-glow{
  position:fixed; top:-120px; left:50%; width:640px; height:640px; border-radius:50%;
  transform:translateX(-50%);
  background:radial-gradient(circle, var(--accent) 0%, transparent 70%);
  filter:blur(120px); opacity:.22; z-index:0; pointer-events:none;
}
.ambient-grain{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  opacity:.1; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ===== Topbar ===== */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30;}
.topbar{
  position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  height:58px; padding:0 18px; background:var(--bg); border-bottom:1px solid var(--border);
}
.tb-brand{display:flex; align-items:center; gap:10px; min-width:0;}
.tb-logo-slot{position:relative; width:22px; height:22px; flex:none;}
.tb-logo{position:absolute; inset:0; width:22px; height:22px; object-fit:contain; opacity:1;}
.tb-logo-glow{
  position:absolute; inset:-7px; border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent) 0%, transparent 70%);
  opacity:.85; animation:tbLogoPulse 1.6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes tbLogoPulse{
  0%,100%{transform:scale(.85); opacity:.55;}
  50%{transform:scale(1.15); opacity:1;}
}
.tb-word{font-family:var(--serif); font-weight:300; font-size:17px; color:var(--text); white-space:nowrap;}
.tb-sep{color:var(--text-dim); font-size:15px;}
.tb-sub{font-family:var(--serif); font-weight:300; font-size:17px; color:var(--accent); white-space:nowrap;}
.tb-back{font-size:13px; color:var(--text-dim); border:1px solid var(--border); border-radius:8px; padding:7px 14px; transition:color .15s, border-color .15s;}
.tb-back:hover{color:var(--text); border-color:var(--accent);}
.tb-new{font-size:13px; font-weight:600; color:#1a1a18; background:var(--accent); border-radius:8px; padding:8px 16px; display:flex; align-items:center; gap:6px; opacity:.55; cursor:not-allowed;}

/* ===== Page ===== */
.page{position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:110px 24px 80px;}

.hub-head{text-align:center; margin-bottom:46px;}
.hub-head h1{font-family:var(--serif); font-weight:300; font-size:clamp(30px,5vw,46px); color:var(--text);}
.hub-head p{margin-top:14px; color:var(--text-dim); font-size:15.5px; max-width:520px; margin-left:auto; margin-right:auto; line-height:1.6;}

.ph-badge{
  display:inline-flex; align-items:center; gap:7px; font-size:11.5px; letter-spacing:.4px; text-transform:uppercase;
  color:var(--accent); background:rgba(217,119,87,.12); border:1px solid rgba(217,119,87,.35);
  border-radius:20px; padding:5px 14px; margin-bottom:18px;
}
.ph-badge .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.4;} 50%{opacity:1;}}

/* ===== Filter bar ===== */
.filter-bar{
  display:flex; gap:10px; align-items:center; margin-bottom:40px;
  background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:8px 8px 8px 18px;
}
.filter-bar input{
  flex:1; background:transparent; border:none; outline:none; color:var(--text);
  font-family:var(--sans); font-size:14px;
}
.filter-bar input::placeholder{color:var(--text-dim);}
.filter-bar select{
  background:var(--panel-alt); border:1px solid var(--border); color:var(--text-dim);
  font-size:13px; border-radius:9px; padding:9px 12px; outline:none;
}
.filter-bar button{
  width:38px; height:38px; border-radius:9px; border:none; background:var(--accent);
  color:#1a1a18; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
}

/* ===== Nexos grid ===== */
.nexos-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
@media (max-width:860px){.nexos-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.nexos-grid{grid-template-columns:1fr;}}

.nexo-card{
  background:linear-gradient(180deg, var(--panel) 0%, var(--panel-alt) 180%);
  border:1px solid var(--border); border-radius:16px; overflow:hidden;
  display:flex; flex-direction:column;
  transition:transform .3s cubic-bezier(.22,1,.36,1), border-color .25s ease, box-shadow .25s ease;
  opacity:0; animation:cardIn .5s cubic-bezier(.22,1,.36,1) forwards;
}
.nexo-card:nth-child(1){animation-delay:.12s;}
.nexo-card:nth-child(2){animation-delay:.18s;}
.nexo-card:nth-child(3){animation-delay:.24s;}
.nexo-card:nth-child(4){animation-delay:.30s;}
.nexo-card:nth-child(5){animation-delay:.36s;}
.nexo-card:nth-child(6){animation-delay:.42s;}
@keyframes cardIn{
  from{opacity:0; transform:translateY(14px);}
  to{opacity:1; transform:none;}
}
@media (prefers-reduced-motion: reduce){
  .nexo-card{animation:none; opacity:1;}
}
.nexo-card:hover{
  transform:translateY(-4px);
  border-color:color-mix(in srgb, var(--accent) 45%, var(--border));
  box-shadow:0 18px 40px -22px rgba(0,0,0,.55);
}
.nexo-thumb{
  height:140px; background:var(--panel-alt); position:relative;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  border-bottom:1px solid var(--border);
}
.nexo-thumb::after{
  content:"Preview"; font-size:11.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-dim);
}
.nexo-thumb.shimmer{
  background:linear-gradient(100deg, var(--panel-alt) 30%, var(--border) 50%, var(--panel-alt) 70%);
  background-size:200% 100%; animation:shimmer 2.6s ease-in-out infinite;
}
@keyframes shimmer{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}
.nexo-body{padding:16px 18px 18px;}
.nexo-title{font-size:14.5px; font-weight:600; color:var(--text); margin-bottom:10px;}
.nexo-author{display:flex; align-items:center; gap:8px;}
.nexo-avatar{
  width:22px; height:22px; border-radius:50%; background:var(--panel-alt); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:12px; flex:none;
}
.nexo-handle{font-size:12.5px; color:var(--text-dim); font-family:var(--mono);}

.hub-footer{margin-top:60px; text-align:center; color:var(--text-dim); font-size:12.5px;}

/* ===== Secciones funcionales añadidas ===== */
.nexo-card{cursor:pointer;}
.nexo-thumb{font-size:40px;}
.nexo-thumb::after{content:none;}
.empty-state{
  text-align:center; padding:50px 20px; color:var(--text-dim); font-size:14px;
  border:1px dashed var(--border); border-radius:14px;
}
.risk-section{margin-bottom:46px;}
.risk-head{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.risk-head h2{font-family:var(--serif); font-weight:300; font-size:20px; color:var(--text);}
.risk-badge{
  font-size:11px; letter-spacing:.3px; text-transform:uppercase; color:#f0b45e;
  background:rgba(240,180,94,.12); border:1px solid rgba(240,180,94,.35);
  border-radius:20px; padding:3px 10px;
}
.risk-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:860px){.risk-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.risk-grid{grid-template-columns:1fr;}}
.risk-card{
  background:var(--panel); border:1px solid rgba(240,180,94,.3); border-radius:14px; padding:14px 16px;
  display:flex; flex-direction:column; gap:8px;
}
.risk-card.mine{border-color:var(--accent); box-shadow:0 0 0 1px rgba(217,119,87,.25) inset;}
.risk-top{display:flex; align-items:center; gap:8px;}
.risk-title{font-size:13.5px; font-weight:600; color:var(--text);}
.risk-meta{font-size:11.5px; color:var(--text-dim);}
.risk-actions{display:flex; gap:8px; margin-top:4px;}
.risk-btn{
  flex:1; font-size:12px; text-align:center; padding:7px 0; border-radius:8px; cursor:pointer;
  border:1px solid var(--border); color:var(--text-dim); background:transparent;
}
.risk-btn.primary{background:var(--accent); color:#1a1a18; border-color:var(--accent); font-weight:600;}
.mine-tag{font-size:10px; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.3px;}
</style>
</head>
<body>

<div class="ambient-glow"></div>
<div class="ambient-grain"></div>

<header class="topbar">
  <div class="tb-brand">
    <div class="tb-logo-slot">
      <div class="tb-logo-glow"></div>
      <img class="tb-logo" src="QwenIconload.png" alt="Qwen Studio">
    </div>
    <span class="tb-word">Qwen Studio</span>
    <span class="tb-sub">Nexus</span>
  </div>
  <div style="display:flex; gap:10px; align-items:center;">
    <a href="index.html" class="tb-back">← Back</a>
    <span class="tb-new">+ New Nexus</span>
  </div>
</header>

<div class="page">
  <div class="hub-head">
    <span class="ph-badge"><span class="dot"></span> Coming soon</span>
    <h1>Nexus Hub</h1>
    <p>A shared space for Nexus — HTML pages and presentations published anonymously by the community. This is an early preview; nothing here is live yet.</p>
  </div>

  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Filter Nexos...">
    <select id="categorySelect">
      <option value="">All categories</option>
      <option value="presentacion">Presentations</option>
      <option value="codigo">Code</option>
    </select>
    <button aria-label="Search" id="searchBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1a1a18" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
  </div>

  <div id="riskSection" class="risk-section" style="display:none;">
    <div class="risk-head">
      <h2>At risk</h2>
      <span class="risk-badge">Oldest first</span>
    </div>
    <div id="riskGrid" class="risk-grid"></div>
  </div>

  <div id="nexosGrid" class="nexos-grid">
    <div class="empty-state">Loading Nexos…</div>
  </div>

  <p class="hub-footer" id="hubFooter">Loading manifest…</p>
</div>

<script>
const MANIFEST_URL = "manifest.json";
const NEXOS_DIR = "nexos/";

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
}
function fmtSize(bytes){
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/1024/1024).toFixed(2) + " MB";
}
function getClaimKeys(){
  try { return JSON.parse(localStorage.getItem("nexus_claim_keys") || "{}"); }
  catch(e){ return {}; }
}

let manifest = { nexos: [] };
let searchTerm = "";
let categoryFilter = "";

function applyFilters(){
  searchTerm = document.getElementById("searchInput").value.trim().toLowerCase();
  categoryFilter = document.getElementById("categorySelect").value;
  render();
}

function openNexo(id){
  window.location.href = NEXOS_DIR + id + ".html";
}

function renderActiveGrid(){
  const grid = document.getElementById("nexosGrid");
  const active = manifest.nexos.filter(n => n.status === "active" || n.status === "at_risk");
  const filtered = active.filter(n => {
    const matchesText = !searchTerm || n.title.toLowerCase().includes(searchTerm) || n.pseudonym.toLowerCase().includes(searchTerm);
    const matchesCat = !categoryFilter || n.category === categoryFilter;
    return matchesText && matchesCat;
  }).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

  if (filtered.length === 0){
    grid.innerHTML = `<div class="empty-state">No Nexos match that filter yet.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(n => `
    <div class="nexo-card" onclick="openNexo('${n.id}')">
      <div class="nexo-thumb">${n.avatar}</div>
      <div class="nexo-body">
        <div class="nexo-title">${n.title}</div>
        <div class="nexo-author">
          <div class="nexo-avatar">${n.avatar}</div>
          <span class="nexo-handle">${n.pseudonym}</span>
        </div>
      </div>
    </div>
  `).join("");
}

function renderRiskSection(){
  const section = document.getElementById("riskSection");
  const riskGrid = document.getElementById("riskGrid");
  const myKeys = getClaimKeys();

  const atRisk = manifest.nexos
    .filter(n => n.status === "at_risk")
    .sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

  if (atRisk.length === 0){
    section.style.display = "none";
    return;
  }
  section.style.display = "block";

  riskGrid.innerHTML = atRisk.map(n => {
    const isMine = myKeys[n.id] === n.claim_key;
    return `
      <div class="risk-card ${isMine ? "mine" : ""}">
        <div class="risk-top">
          <span>${n.avatar}</span>
          <span class="risk-title">${n.title}</span>
          ${isMine ? '<span class="mine-tag">Yours</span>' : ""}
        </div>
        <div class="risk-meta">${n.pseudonym} · published ${fmtDate(n.created_at)} · ${fmtSize(n.size_bytes)}</div>
        <div class="risk-actions">
          <a class="risk-btn" href="${NEXOS_DIR}${n.id}.html" download>Download</a>
          <button class="risk-btn primary" onclick="alert('Resubmit flow goes through the Tkinter app — open Qwen Studio and use Publish Nexus on this file to renew it.')">Resubmit</button>
        </div>
      </div>
    `;
  }).join("");
}

async function loadManifest(){
  try {
    const res = await fetch(MANIFEST_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("manifest not found");
    manifest = await res.json();
    const activeCount = manifest.nexos.filter(n => n.status === "active" || n.status === "at_risk").length;
    document.getElementById("hubFooter").textContent =
      `${activeCount} / ${manifest.limit} Nexos active · warning zone starts at ${manifest.warning_threshold}.`;
    render();
  } catch (err){
    document.getElementById("nexosGrid").innerHTML =
      `<div class="empty-state">Couldn't load manifest.json. Make sure it's published alongside this page.</div>`;
    document.getElementById("hubFooter").textContent = "Manifest unavailable.";
  }
}

function render(){
  renderRiskSection();
  renderActiveGrid();
}

document.getElementById("searchInput").addEventListener("input", applyFilters);
document.getElementById("categorySelect").addEventListener("change", applyFilters);
document.getElementById("searchBtn").addEventListener("click", applyFilters);

loadManifest();
</script>

</body>
</html>
