<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexo de prueba</title>
<style>
  :root{
    --bg:#141312; --text:#faf9f5; --accent:#d97757;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){ --bg:#faf9f5; --text:#141312; }
  }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; text-align:center;
  }
  .card{padding:40px;}
  h1{font-size:28px; margin-bottom:10px;}
  p{color:var(--accent); font-size:14px;}
</style>
</head>
<body>
  <div class="card">
    <h1>🎉 Este es un Nexo de prueba</h1>
    <p>Si estás viendo esto, el hub está sirviendo Nexos correctamente.</p>
  </div>
</body>
</html>
